<div class="alert-wrap" [class]="cls" *ngIf="result">
  <div class="alert-card">
    <div class="alert-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div class="alert-body">
      <h4>AI Moderation Alert</h4>
      <p>Action: <strong>{{ result.action | uppercase }}</strong> &nbsp;|&nbsp; Confidence: <strong>{{ (result.confidence*100).toFixed(0) }}%</strong></p>
      <div class="labels"><span *ngFor="let l of result.labels">{{ l }}</span></div>
    </div>
    <button class="dismiss-btn" (click)="dismiss()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>
