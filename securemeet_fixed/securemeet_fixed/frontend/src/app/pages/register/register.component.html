<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      SecureMeet
    </div>
    <h2>Create your account</h2>
    <p class="auth-sub">Join SecureMeet today</p>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="username" placeholder="Your display name"/>
    </div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" [(ngModel)]="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Minimum 6 characters"/>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select [(ngModel)]="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <button class="btn-primary btn-full" (click)="register()" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Create Account' }}
    </button>

    <p class="auth-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
