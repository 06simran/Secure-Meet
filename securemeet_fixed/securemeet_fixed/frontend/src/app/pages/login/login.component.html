<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      SecureMeet
    </div>
    <h2>Sign in to your account</h2>
    <p class="auth-sub">Enter your credentials to continue</p>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" [(ngModel)]="email" placeholder="you@example.com" (keyup.enter)="login()"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Your password" (keyup.enter)="login()"/>
    </div>

    <button class="btn-primary btn-full" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign in' }}
    </button>

    <p class="auth-link">Don't have an account? <a routerLink="/register">Create one</a></p>
  </div>
</div>
